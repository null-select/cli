name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go test -race ./...
          go vet ./...
      - name: Build release binaries
        run: |
          make cross-build \
            VERSION="${GITHUB_REF_NAME#v}" \
            COMMIT="$GITHUB_SHA" \
            BUILT_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/nullselect_*
          dist/checksums.txt
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
