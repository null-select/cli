name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Verify
        run: make verify
      - name: Build public Linux release binaries
        run: |
          make linux-release \
            VERSION="${GITHUB_REF_NAME#v}" \
            COMMIT="$GITHUB_SHA" \
            BUILT_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: dist/nullselect_linux_*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/nullselect_linux_amd64
          dist/nullselect_linux_arm64
          dist/checksums.txt
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
