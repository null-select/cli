name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Cross-compile supported targets
        run: make cross-build VERSION=ci COMMIT="$GITHUB_SHA" BUILT_AT="1970-01-01T00:00:00Z"
